<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>سامانه ثبت و پیگیری ساعات مطالعه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#eef5ff;--c:rgba(255,255,255,.92);--t:#102349;--m:#5a6b8c;--ln:#d5e2f7;--n:#0b2a66;--b:#1565e8;--g:#0f8a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09132a;--c:rgba(16,30,62,.94);--t:#e8efff;--m:#9db0d6;--ln:#24396a}}
:root[data-theme="dark"]{--bg:#09132a;--c:rgba(16,30,62,.94);--t:#e8efff;--m:#9db0d6;--ln:#24396a}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.8;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hero{min-height:100vh;background:linear-gradient(#5aa2f5,#cfe6ff 45%,#e6f5ea 68%,#7bbf8c);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:12px 14px 0}
.hero>svg.mt{position:absolute;bottom:18%;right:0;width:100%;height:30%;opacity:.55;pointer-events:none}
.hero>*{position:relative}
.top{align-self:stretch;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;background:rgba(11,42,102,.82);color:#fff;border-radius:14px;padding:6px 14px;font-size:.85rem}
.ctr{text-align:center;color:#0b2a66}
.ctr h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:900;line-height:1.4}
.ctr h2{font-size:clamp(1rem,3.4vw,1.4rem)}
.ctr p{color:#27457f;margin:4px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;max-width:640px;width:100%}
.card{background:var(--c);backdrop-filter:blur(10px);border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 30px #0b2a6640;border:1px solid #1565e855}
.card.a{border-color:#0f8a5f66}
.ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#dbeaff;color:var(--b)}
.card.a .ic{background:#d3f5e6;color:var(--g)}
.card h3{font-size:1.25rem}.card p{color:var(--m);font-size:.9rem;margin:4px 0 12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:10px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}
.btn.g{background:var(--g)}.btn.o{background:transparent;color:var(--b);border:1px solid var(--b)}
.btn:disabled{opacity:.6}
.ft{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin:20px 0;background:rgba(255,255,255,.8);color:#0b2a66;border-radius:16px;padding:10px 20px;font-size:.9rem;font-weight:700}
.foot{margin-top:auto;align-self:stretch;background:#0b2a66;color:#fff;text-align:center;padding:12px;border-radius:24px 24px 0 0;font-size:.85rem}
.lw{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#0b2a66,#1565e8 60%,#7fb8ff)}
.lb{background:var(--c);border-radius:20px;padding:24px;width:100%;max-width:400px;box-shadow:0 14px 40px #0006}
.lb h2{text-align:center;margin:6px 0}
label{display:block;font-size:.85rem;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--ln);background:transparent;border-radius:10px;padding:9px 12px}
select option{color:#102349}
.pw{position:relative}.pw button{position:absolute;left:8px;top:6px;border:0;background:none;color:var(--b);cursor:pointer;font-size:.8rem}
.er{color:#d33;font-size:.85rem;min-height:1.4em;margin:8px 0}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:#0b2a66;color:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
aside .lg{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.9rem}
aside a{padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.92rem}
aside a.on{background:var(--b)}aside a:hover{background:#ffffff1f}
section{padding:16px;min-width:0}
.hd{background:linear-gradient(120deg,#0b2a66,#1565e8);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.hd h2{font-size:1.15rem}.hd p{opacity:.9;font-size:.9rem}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.gr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.st,.pn{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;min-width:0}
.st small{color:var(--m)}.st b{display:block;font-size:1.15rem}
.pb{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--g)}
.pn h3{font-size:1rem;margin-bottom:8px}
.bars{display:flex;gap:3px;align-items:flex-end;height:150px;overflow-x:auto}
.bc{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.65rem;color:var(--m)}
.bc i{display:block;width:70%;max-width:34px;background:linear-gradient(var(--b),#6aa5ff);border-radius:6px 6px 0 0;min-height:2px}
.bc span{white-space:nowrap;margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--m);font-weight:700}
tr.k{cursor:pointer}tr.k:hover{background:#1565e812}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:120px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .btn{width:auto;padding:6px 18px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:#0f8a5f;color:#fff;padding:10px 20px;border-radius:12px;z-index:9;box-shadow:0 6px 20px #0005}
.toast.x{background:#d33}
.note{font-size:.78rem;color:var(--m);text-align:center;margin-top:10px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;position:sticky;top:0;z-index:5;padding:8px}aside .lg{display:none}aside a{padding:6px 10px;font-size:.82rem}}


.hero{background:var(--hero) center bottom/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.08) 42%,rgba(11,42,102,.14));pointer-events:none}
.ft span{text-align:center;padding:0 16px}.ft small{display:block;font-weight:400;color:#5a6b8c;font-size:.74rem}.ft span+span{border-right:1px solid #c9d8f0}
.lw{background:linear-gradient(rgba(225,238,255,.82),rgba(190,215,255,.9)),var(--login) center/cover}
.lw.ad{background:linear-gradient(rgba(8,28,72,.8),rgba(8,28,72,.92)),var(--login) center/cover}
aside{background:linear-gradient(rgba(11,42,102,.8),rgba(11,42,102,.92)),var(--side) center bottom/cover}
aside .lg img{background:#fff;border-radius:10px;padding:3px}aside .q{margin-top:auto;font-size:.8rem;opacity:.85;padding:10px;text-align:center}
.tb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:8px 14px;margin-bottom:14px}
.tl,.tr{display:flex;align-items:center;gap:10px}.tl small,.us small{display:block;color:var(--m);font-size:.72rem}.us{line-height:1.4}.tr{font-size:.85rem;gap:12px}.dp{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:3px 10px}
.hd{color:#0b2a66;background:linear-gradient(to left,rgba(255,255,255,.96) 42%,rgba(255,255,255,.1)),var(--adm) center/cover;border:1px solid var(--ln);min-height:112px;display:flex;flex-direction:column;justify-content:center}
.hd.sb{background:linear-gradient(to left,rgba(255,255,255,.96) 42%,rgba(255,255,255,.1)),var(--stu) center/cover}
.hd p{opacity:1;color:#27457f}
.si{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#e3efff;margin-bottom:4px}
.rc{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.promo{display:flex;align-items:flex-start;padding:16px;border-radius:14px;min-height:220px;background:linear-gradient(rgba(255,255,255,.78),rgba(255,255,255,0) 65%),var(--promo) center/cover;font-weight:900;color:#0b2a66;font-size:1.1rem;line-height:1.9}
@media(max-width:800px){.rc{grid-template-columns:1fr}aside .q{display:none}.hd,.hd.sb{background-image:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)),var(--adm)}.hd.sb{background-image:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.88)),var(--stu)}}

.hero{background:var(--hero) center/cover no-repeat}
.hero::before{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(11,42,102,.1))}
.top{align-self:flex-end;background:rgba(11,42,102,.82);backdrop-filter:blur(6px);border-radius:999px;padding:6px 16px;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:nowrap;font-size:.8rem}.top span{display:flex;gap:6px;align-items:center;white-space:nowrap}.top i{width:1px;height:14px;background:#fff6}
.qt{position:absolute;top:70px;right:32px;text-align:right;color:#0b2a66;font-weight:700;font-size:1.05rem;line-height:1.8;text-shadow:0 1px 8px #fff}.qt small{display:block;font-weight:400;font-size:.8rem}
.ctr{margin-top:6px}.ctr h1{text-shadow:0 2px 14px rgba(255,255,255,.8)}.ctr h2{font-weight:700;text-shadow:0 2px 10px rgba(255,255,255,.8)}
.ctr p{display:flex;gap:12px;align-items:center;justify-content:center;color:#0b2a66;font-weight:700}.ctr p i{width:44px;height:1px;background:#0b2a66}
.cards{max-width:660px}
.card{background:rgba(255,255,255,.84);color:#102349;border-radius:22px}.card p{color:#4a5d80}.card .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
.card .ic{width:70px;height:70px}
.ft{max-width:660px;width:100%;flex-wrap:nowrap;justify-content:space-around;gap:0;padding:12px 6px;background:rgba(255,255,255,.74);backdrop-filter:blur(8px);margin:18px 0 22px}
.ft div{flex:1;text-align:center;color:#0b2a66;font-weight:700;font-size:.88rem;line-height:1.5;padding:0 6px}.ft small{display:block;font-weight:400;color:#5a6b8c;font-size:.72rem}.ft div+div{border-right:1px solid #c9d8f0}
.foot{margin:auto -14px 0;background:linear-gradient(#0b2a66,#08204f);border-radius:60% 60% 0 0/26px 26px 0 0;padding:20px 12px 12px;line-height:1.6}
.lw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;background:linear-gradient(rgba(235,244,255,.45),rgba(235,244,255,.97) 60%),var(--lm) center top/cover}
.lw.ad{background:linear-gradient(rgba(8,28,72,.78),rgba(8,28,72,.94)),var(--hm) center/cover}
.lh{text-align:center;color:#0b2a66}.lh h1{font-size:1.7rem;font-weight:900}.lh p{color:#27457f}.lw.ad .lh,.lw.ad .lh p{color:#fff}
.bk{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;display:flex;gap:6px;align-items:center;font-size:.85rem;color:#0b2a66;cursor:pointer;background:#ffffffb0;padding:5px 12px;border-radius:999px}
.lb h2{display:flex;align-items:center;justify-content:center;gap:8px}.lb h2 svg{width:26px;height:26px;color:var(--b)}.lw.ad .lb h2 svg{color:var(--g)}
.lb .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
aside{width:auto;gap:6px}.ub{display:flex;gap:10px;align-items:center;padding:6px 4px 14px;margin-bottom:6px;border-bottom:1px solid #ffffff22}.ub small{display:block;opacity:.8;font-size:.75rem}.av{width:46px;height:46px;flex:none;border-radius:50%;background:#2a5fc7;display:grid;place-items:center}
aside a{display:flex;align-items:center;gap:10px}
.tl,.tr{display:flex;align-items:center;gap:10px}.tl small,.us small{display:block;color:var(--m);font-size:.72rem}.sl{color:var(--g);font-weight:700;font-size:.85rem}.dp{display:flex;gap:6px;align-items:center}
.si{width:42px;height:42px;border-radius:12px}.si svg{width:24px;height:24px}.st b{font-size:1.3rem;margin:2px 0}.st em{display:block;font-style:normal;font-size:.75rem;color:var(--g)}
.gr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-bottom:14px}
.ll{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;font-size:.62rem;color:var(--m);text-align:center}
.dn{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}.dn p{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:2px 0}.dn p i{width:10px;height:10px;border-radius:50%}.dn p b{margin-right:auto;padding-right:16px}
.eye,.lk{color:var(--b);cursor:pointer}.bars{height:150px}.bc i{background:#5b9bff}
@media(max-width:800px){aside{flex-direction:row;overflow-x:auto;flex-wrap:nowrap}aside a{flex:none;white-space:nowrap;padding:7px 12px}.ub,aside .q,.qt,.sl{display:none}}
@media(max-width:700px){.hero{background-image:var(--hm)}.ctr h1{font-size:2rem}.ft{margin-top:14px}}

<script>
const $=s=>document.querySelector(s),app=$('#app');
const F=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const toEn=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const dt=s=>new Date(s+'T12:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const J=d=>{const o={};new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).forEach(p=>o[p.type]=parseInt(p.value));return o};
const fd=(d,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o||{day:'numeric',month:'long'}).format(typeof d=='string'?dt(d):d);
const FULL={weekday:'long',day:'numeric',month:'long',year:'numeric'};
const ws=d=>{const x=new Date(d);x.setHours(12);x.setDate(x.getDate()-(x.getDay()+1)%7);return x};
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return F(m?[h&&h+' ساعت',r&&r+' دقیقه'].filter(Boolean).join(' و '):'۰ دقیقه')};
const sm=a=>a.reduce((x,i)=>x+i.m,0);
const hm=m=>F(Math.floor(m/60)+':'+String(m%60).padStart(2,'0'));
const bars=a=>{const x=Math.max(...a.map(i=>i.m),1);return`<div class="bars">${a.map(i=>`<div class="bc"><small>${i.m?hm(i.m):''}</small><i style="height:${Math.round(i.m/x*105)}px"></i><span>${i.l}</span></div>`).join('')}</div>`};
const st=(t,val,p,sub)=>{const m=[['میانگین','bar','#0e9aa7'],['پیشرفت','tgt','#0f8a5f'],['دانش','cap','#1565e8'],['امروز','clk','#0f8a5f'],['هفت','cal','#1565e8'],['ماه','cal','#7c4dff']].find(x=>t.includes(x[0]))||['','cal','#1565e8'];

async function boot(r){try{const {data:{session}}=await sb.auth.getSession();if(!session){me=null;return render()}

 if(!p.active)throw new Error('حساب شما غیرفعال است.');

 me=p;stu=null;if(p.role=='student')stu=await ok(sb.from('students').select('id,full_name,student_code,classes(name,grades(name))').single());
 await loadRef();v=p.must_change_password?'pw':p.role=='student'?'dash':'sdash';render()}
 catch(e){await sb.auth.signOut();me=null;v=r=='a'?'la':r=='s'?'ls':'home';render();err(e.message)}}

function rng(k){const t=new Date(),e=new Date(t),a=new Date(t);
 if(k=='w'||k=='lw'){const s=ws(t);if(k=='lw')s.setDate(s.getDate()-7);const f=new Date(s);f.setDate(f.getDate()+6);return[iso(s),iso(f)]}
 if(k=='m'){a.setDate(a.getDate()-(J(t).day-1));return[iso(a),iso(e)]}
 if(k=='lm'){const s=new Date(t);s.setDate(s.getDate()-(J(t).day-1));const f=new Date(s);f.setDate(f.getDate()-1);const g=new Date(f);g.setDate(g.getDate()-(J(f).day-1));return[iso(g),iso(f)]}
 a.setDate(a.getDate()-6);return[iso(a),iso(e)]}

<div class="gr3">${pn('روند روزانه بازه (ساعت)',line(d.trend.map((x,i)=>({l:i%5==0?fd(x.d,{day:'numeric'}):'',m:x.minutes}))))}${pn('مطالعه بر اساس کلاس (ساعت)',bars(d.by_class.map(x=>({l:x.grade+'-'+x.class,m:x.minutes}))))}${pn('مطالعه بر اساس درس',tbh(['درس','مدت'],d.by_subject.map(x=>[E(x.subject),dur(x.minutes)])))}</div>

async function vMiss(){const [a,b]=rng(Fq.p),dd=Fq.d||iso(new Date()),days=Array.from({length:8},(_,k)=>{const x=new Date();x.setDate(x.getDate()-k);return[iso(x),fd(x,FULL)]});

async function vSl(){const P=20,r=await ok(sb.rpc('staff_students',{p_search:Sq.q||null,p_limit:P,p_offset:Sq.p*P})),n=r.length?Math.ceil(r[0].total_count/P):1;
 const um=isM()&&r.length?Object.fromEntries((await ok(sb.from('students').select('id,user_id').in('id',r.map(x=>x.id)))).map(x=>[x.id,x.user_id])):{};
 return pn('فهرست دانش‌آموزان',`<div class="row"><input id="sq" value="${E(Sq.q)}" placeholder="جستجوی نام یا شماره دانش‌آموزی"><button class="btn" onclick="Sq.q=$('#sq').value;Sq.p=0;render()">جستجو</button></div>`+tbh(['ردیف','نام','شماره دانش‌آموزی','پایه','کلاس','وضعیت','جزئیات',...(isM()?['عملیات']:[])],r.map((s,i)=>[F(Sq.p*P+i+1),E(s.full_name),E(s.student_code),E(s.grade),E(s.class_name),s.active?'فعال':'غیرفعال',`<a class="eye" onclick="go('det','${s.id}')">${ico('eye',20)}</a>`,...(isM()?[`<a class="lk" onclick="tgU('${um[s.id]}',${!s.active})">${s.active?'غیرفعال‌سازی':'فعال‌سازی'}</a> · <a class="lk" onclick="rsU('${um[s.id]}')">بازنشانی رمز</a>`]:[])]))+`<div class="row" style="margin-top:10px"><button class="btn o" ${Sq.p?'':'disabled'} onclick="Sq.p--;render()">قبلی</button><span style="text-align:center">صفحه ${F(Sq.p+1)} از ${F(n)}</span><button class="btn o" ${Sq.p<n-1?'':'disabled'} onclick="Sq.p++;render()">بعدی</button></div>`)}
async function vDet(){const [s,w,mo,rc,i]=await Promise.all([ok(sb.rpc('student_summary',{p_student:arg})),ok(sb.rpc('student_week',{p_student:arg})),ok(sb.rpc('student_month',{p_student:arg})),recs(0,20,arg),ok(sb.from('students').select('full_name,student_code,classes(name,grades(name))').eq('id',arg).single())]),td=iso(new Date());
 return`<button class="btn o" style="width:auto;margin-bottom:10px" onclick="go('sl')">→ بازگشت به فهرست</button><div class="hd"><h2>${E(i.full_name)}</h2><p>پایه ${E(i.classes.grades.name)} · کلاس ${E(i.classes.name)}</p></div><div class="gr">${st('امروز',dur(s.today_min))}${st('این هفته',dur(s.week_min))}${st('این ماه',dur(s.month_min))}${st('روزهای فعال این ماه',F(s.active_days))}</div><div class="gr2">${pn('این هفته (ساعت)',bars(w.map(x=>({l:DAYS[x.day_index],m:x.minutes}))))}${pn('روند ماه جاری (ساعت)',line(mo.filter(x=>x.study_date<=td).map(x=>({l:(x.jalali_day==1||x.jalali_day%5==0)?F(x.jalali_day):'',m:x.minutes}))))}</div>`+pn('سوابق اخیر',rt(rc,0))}
async function vXl(){return`<div class="hd"><h2>گزارش اکسل</h2><p>فایل شامل سه برگه است: خلاصه دانش‌آموزان، خلاصه کلاس‌ها و ریز رکوردها. فقط دانش‌آموزان مجاز برای شما در گزارش می‌آیند.</p></div>`+fbar(1)+`<button class="btn" id="xb" style="max-width:260px" onclick="exportXlsx()">دریافت فایل اکسل</button>`}
async function exportXlsx(){const [a,b]=rng(Fq.p),btn=$('#xb');btn.disabled=true;
 try{const d=await ok(sb.rpc('report_data',{p_from:a,p_to:b,...fp(),p_student:null,p_subject:Fq.s?+Fq.s:null})),subs=REF.subjects.map(x=>x.name),h2=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0'),ttl=[['گزارش مطالعه — مدرسه شهید بهشتی'],['از '+d.period.from_jalali+' تا '+d.period.to_jalali+' | روزهای مدرسه در بازه: '+d.period.expected_days],[]];
 const S1=[...ttl,['کد دانش‌آموزی','نام','پایه','کلاس','مجموع (دقیقه)','مجموع (ساعت:دقیقه)',...subs,'تعداد رکوردها','روزهای دارای ثبت','میانگین روزانه (دقیقه)','روزهای مورد انتظار بدون ثبت']];
 d.students.forEach(s=>S1.push([s.student_code,s.name,s.grade,s.class,s.total_min,h2(s.total_min),...subs.map(n=>s.by_subject[n]||0),s.records,s.days,s.avg_daily_min,s.missing_expected_days]));
 const T=d.students.reduce((x,s)=>x+s.total_min,0);S1.push(['','جمع کل','','',T,h2(T),...subs.map(n=>d.students.reduce((x,s)=>x+(s.by_subject[n]||0),0)),d.students.reduce((x,s)=>x+s.records,0)]);
 const S2=[...ttl,['پایه','کلاس','تعداد دانش‌آموز','دارای ثبت','بدون ثبت','مجموع (دقیقه)','مجموع (ساعت:دقیقه)','میانگین هر دانش‌آموز (دقیقه)',...subs]];
 d.classes.forEach(c=>S2.push([c.grade,c.class,c.students,c.submitted,c.missing,c.total_min,h2(c.total_min),c.avg_per_student_min,...subs.map(n=>c.by_subject[n]||0)]));
 const S3=[...ttl,['شناسه رکورد','کد دانش‌آموزی','نام','پایه','کلاس','تاریخ شمسی','تاریخ میلادی','درس','ساعت شروع','مدت (دقیقه)','مدت (ساعت:دقیقه)','زمان ثبت','آخرین ویرایش']];
 d.records.forEach(r=>S3.push([r.record_id,r.student_code,r.name,r.grade,r.class,r.jalali_date,r.date,r.subject,r.start_time||'',r.minutes,h2(r.minutes),String(r.created_at).slice(0,16).replace('T',' '),r.updated_at?String(r.updated_at).slice(0,16).replace('T',' '):'']));
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 [['خلاصه دانش‌آموزان',S1],['خلاصه کلاس‌ها',S2],['ریز رکوردها',S3]].forEach(([n,A])=>{const w=XLSX.utils.aoa_to_sheet(A);w['!cols']=A[3].map((_,i)=>({wch:Math.min(40,Math.max(10,...A.slice(3).map(r=>String(r[i]??'').length))+2)}));XLSX.utils.book_append_sheet(wb,w,n)});
 XLSX.writeFile(wb,`study-report-${a}_${b}.xlsx`);toast('فایل اکسل ساخته شد.')}catch(e){toast(e.message,1)}btn.disabled=false}

 +(me.role=='owner'?'<div style="height:14px"></div>'+pn('حساب‌های مدیریتی (فقط مالک)',tbh(['نام کاربری','نقش','وضعیت','عملیات'],pr.map(p=>[E(p.username),p.role=='admin'?'مدیر':'معاون',p.active?'فعال':'غیرفعال',`<a class="lk" onclick="tgU('${p.id}',${!p.active})">${p.active?'غیرفعال‌سازی':'فعال‌سازی'}</a> · <a class="lk" onclick="rsU('${p.id}')">بازنشانی رمز</a> · <a class="lk" onclick="setRole('${p.id}','${p.role=='admin'?'deputy':'admin'}')">تبدیل به ${p.role=='admin'?'معاون':'مدیر'}</a>`]))):'')

async function vAu(){const r=await ok(sb.from('audit_logs').select('created_at,action,target,details').order('created_at',{ascending:false}).limit(100));
 return pn('گزارش رویدادها (۱۰۰ مورد آخر)',tbh(['زمان','رویداد','هدف','جزئیات'],r.map(x=>[new Date(x.created_at).toLocaleString('fa-IR'),E(x.action),E(String(x.target||'').slice(0,8)),E(JSON.stringify(x.details||{}).slice(0,80))])))}

const VIEWS={dash:vDash,reg:vReg,rw:vRw,rm:vRm,hist:vHist,pw:async()=>pwV(),sdash:vSdash,sl:vSl,det:vDet,miss:vMiss,xl:vXl,mg:vMg,au:vAu},SV=['dash','reg','rw','rm','hist'];
async function render(){if(!sb){app.innerHTML=setupV();return}
 if(v=='home'){app.innerHTML=home();return}if(v=='ls'||v=='la'){app.innerHTML=loginV(v=='la'?'a':'s');return}
 if(!me){v='home';app.innerHTML=home();return}
 if(isS()&&!SV.concat('pw').includes(v))v='dash';if(!isS()&&SV.includes(v))v='sdash';if(['mg','au'].includes(v)&&!isM())v='sdash';
 if(me.must_change_password){v='pw';app.innerHTML=`<div class="lw"><div style="width:100%;max-width:440px">${pwV()}</div></div>`;return}
 const my=v;app.innerHTML=shell(isS()?SN:STN(),'<div class="pn">در حال بارگذاری…</div>');
 try{const h=await VIEWS[v]();if(my==v)$('#main').innerHTML=h}catch(e){$('#main').innerHTML=`<div class="pn er">${E(e.message||'خطا در ارتباط با پایگاه داده. اتصال اینترنت را بررسی کنید.')}</div>`}}
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&me){me=null;v='home';render()}});boot()}else render();
</script></body></html>
